<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Professional Skills</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    background:linear-gradient(135deg,#0f172a,#1e293b);
    padding:50px;
}

.container{
    max-width:1100px;
    margin:auto;
}

.title{
    text-align:center;
    color:white;
    font-size:42px;
    margin-bottom:40px;
}

.title span{
    color:#38bdf8;
}

.skills-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
    gap:25px;
}

.card{
    background:rgba(255,255,255,0.08);
    backdrop-filter:blur(12px);
    border:1px solid rgba(255,255,255,0.15);
    border-radius:25px;
    padding:30px;
    transition:0.4s;
    color:white;
}

.card:hover{
    transform:translateY(-10px);
    box-shadow:0 15px 35px rgba(0,0,0,0.4);
}

.frontend{
    border-top:6px solid #3b82f6;
}

.backend{
    border-top:6px solid #22c55e;
}

.tools{
    border-top:6px solid #f97316;
}

.card h2{
    text-align:center;
    margin-bottom:25px;
    font-size:26px;
}

.skill{
    background:rgba(255,255,255,0.08);
    padding:12px;
    border-radius:12px;
    margin-bottom:12px;
    text-align:center;
    transition:0.3s;
}

.skill:hover{
    background:rgba(255,255,255,0.18);
    transform:scale(1.03);
}

@media(max-width:768px){
    .title{
        font-size:32px;
    }
}
</style>
</head>

<body>

<div class="container">

<h1 class="title">
🚀 <span>Professional Skills</span>
</h1>

<div class="skills-grid">

<div class="card frontend">
<h2>💻 Frontend</h2>

<div class="skill">HTML5</div>
<div class="skill">CSS3</div>
<div class="skill">JavaScript</div>
<div class="skill">React.js</div>
<div class="skill">Bootstrap</div>
<div class="skill">Responsive Design</div>

</div>

<div class="card backend">
<h2>⚙️ Backend</h2>

<div class="skill">Node.js</div>
<div class="skill">Express.js</div>
<div class="skill">REST APIs</div>
<div class="skill">CRUD Operations</div>
<div class="skill">JSON Handling</div>
<div class="skill">API Integration</div>

</div>

<div class="card tools">
<h2>🛠 Tools</h2>

<div class="skill">Git & GitHub</div>
<div class="skill">VS Code</div>
<div class="skill">npm</div>
<div class="skill">Debugging</div>
<div class="skill">Problem Solving</div>
<div class="skill">Team Collaboration</div>

</div>

</div>

</div>

</body>
</html>
